<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>JSON Formatter & Validator | Format and Minify JSON</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../style.css?v=20261109-3"><script defer src="json-formatter.js?v=20261109-3"></script><meta name="description" content="Format, minify and validate JSON online. Get readable indentation and syntax error locations. Free, private, browser-based."><link rel="canonical" href="https://stone2013.github.io/tiny-web-toolbox/tools/json-formatter.html"><meta property="og:type" content="website"><meta property="og:title" content="JSON Formatter & Validator | Format and Minify JSON"><meta property="og:description" content="Format, minify and validate JSON online. Get readable indentation and syntax error locations. Free, private, browser-based."><meta property="og:url" content="https://stone2013.github.io/tiny-web-toolbox/tools/json-formatter.html"><meta name="twitter:card" content="summary"></head>
<body><header class="header"><div class="wrap header-inner"><a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">Tiny Web Toolbox</a><div class="actions"><div class="lang"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh-CN" aria-pressed="false">简中</button></div><a class="gh" href="https://github.com/stone2013/tiny-web-toolbox">GitHub</a></div></div></header>
<main class="wrap tool-main"><a class="back" href="../index.html">← <span data-en="All tools" data-zh="全部工具">All tools</span></a><h1 data-en="JSON Formatter" data-zh="JSON 格式化工具">JSON Formatter</h1><p class="tool-desc" data-en="Format, minify and validate JSON. Your data stays in this browser." data-zh="格式化、压缩并校验 JSON。数据只在当前浏览器中处理。">Format, minify and validate JSON. Your data stays in this browser.</p>
<section class="panel json-panel"><div class="json-toolbar"><strong data-en="Input JSON" data-zh="输入 JSON">Input JSON</strong><button class="clear" id="clear" data-en="Clear" data-zh="清空">Clear</button></div>
<label class="sr-only" for="json-input" data-en="JSON input" data-zh="JSON 输入">JSON input</label><textarea id="json-input" class="json-area" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder='Paste or type JSON here…' data-en-placeholder='Paste or type JSON here…' data-zh-placeholder='在此粘贴或输入 JSON…'></textarea>
<div class="json-meta"><span><span data-en="Input size" data-zh="输入大小">Input size</span>: <b id="input-size">0 B</b></span><span id="error" class="json-error" role="alert" aria-live="polite"></span></div>
<div class="json-controls"><label class="indent-label"><span data-en="Indent" data-zh="缩进">Indent</span><select id="indent"><option value="2" data-en="2 spaces" data-zh="2 个空格">2 spaces</option><option value="4" data-en="4 spaces" data-zh="4 个空格">4 spaces</option><option value="tab" data-en="Tab" data-zh="制表符">Tab</option></select></label><div class="json-actions"><button class="chip action primary" id="format" data-en="Format" data-zh="格式化">Format</button><button class="chip action" id="minify" data-en="Minify" data-zh="压缩">Minify</button><button class="chip action" id="validate" data-en="Validate" data-zh="校验">Validate</button></div></div>
<div class="json-toolbar output-toolbar"><strong data-en="Result" data-zh="处理结果">Result</strong><div class="json-result-actions"><span><span data-en="Output size" data-zh="输出大小">Output size</span>: <b id="output-size">0 B</b></span><button class="copy" id="copy" data-en="Copy result" data-zh="复制结果">Copy result</button></div></div>
<label class="sr-only" for="json-output" data-en="Formatted JSON result" data-zh="格式化后的 JSON 结果">Formatted JSON result</label><textarea id="json-output" class="json-area json-output" spellcheck="false" readonly placeholder="Your result will appear here…" data-en-placeholder="Your result will appear here…" data-zh-placeholder="处理结果将显示在这里…"></textarea><p class="status" id="status" role="status" aria-live="polite" data-en="Ready. Paste JSON to begin." data-zh="准备就绪，请粘贴 JSON。">Ready. Paste JSON to begin.</p></section><p class="hint" data-en="Privacy: parsing and formatting happen locally. Nothing is uploaded." data-zh="隐私说明：解析和格式化均在本地完成，不会上传任何内容。">Privacy: parsing and formatting happen locally. Nothing is uploaded.</p></main>
<footer class="footer"><div class="wrap">© <span class="year"></span> Tiny Web Toolbox · MIT</div></footer></body></html>
