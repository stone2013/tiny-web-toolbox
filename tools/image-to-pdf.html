<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Image to PDF | Tiny Web Toolbox</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../style.css?v=20261110-2">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script defer src="image-to-pdf.js?v=20261110-1"></script>
<meta name="description" content="Convert images to a PDF locally in your browser."><link rel="canonical" href="https://stone2013.github.io/tiny-web-toolbox/tools/image-to-pdf.html"></head>
<body><header class="header"><div class="wrap header-inner"><a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">Tiny Web Toolbox</a><div class="actions"><div class="lang"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh-CN" aria-pressed="false">简中</button></div><a class="gh" href="https://github.com/stone2013/tiny-web-toolbox">GitHub</a></div></div></header>
<main class="wrap tool-main"><a class="back" href="../index.html">← <span data-en="All tools" data-zh="全部工具">All tools</span></a><h1 data-en="Image to PDF" data-zh="图像转 PDF">Image to PDF</h1><p class="tool-desc" data-en="Combine images into a PDF. Files are processed locally in your browser." data-zh="将多张图片合并为 PDF。文件仅在浏览器本地处理。">Combine images into a PDF. Files are processed locally in your browser.</p>
<section class="panel image-pdf-panel">
<label class="pdf-upload" for="image-files"><span class="pdf-upload-icon">IMG</span><strong data-en="Choose images" data-zh="选择图片">Choose images</strong><span data-en="Select one or more JPG, PNG or WebP images" data-zh="可选择一张或多张 JPG、PNG 或 WebP 图片">Select one or more JPG, PNG or WebP images</span><input id="image-files" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple></label>
<div class="image-pdf-meta" id="image-pdf-meta" aria-live="polite"></div>
<div class="image-pdf-list" id="image-pdf-list"><p class="pdf-empty" data-en="Selected images will appear here, in PDF page order." data-zh="所选图片会按 PDF 页面顺序显示在这里。">Selected images will appear here, in PDF page order.</p></div>
<div class="image-pdf-options"><label class="pdf-option"><span data-en="Page layout" data-zh="页面布局">Page layout</span><select id="image-pdf-layout"><option value="a4" data-en="Fit to A4" data-zh="适应 A4 页面">Fit to A4</option><option value="image" data-en="Match image size" data-zh="匹配图片尺寸">Match image size</option></select></label><label class="pdf-option"><span data-en="Image quality" data-zh="图片质量">Image quality</span><select id="image-pdf-quality"><option value="0.8" data-en="Smaller file" data-zh="较小文件">Smaller file</option><option value="0.92" selected data-en="Balanced" data-zh="均衡">Balanced</option><option value="1" data-en="Best quality" data-zh="最高质量">Best quality</option></select></label></div>
<div class="pdf-actions"><button class="chip pdf-primary" id="image-pdf-create" type="button" disabled data-en="Create PDF" data-zh="生成 PDF">Create PDF</button><button class="chip" id="image-pdf-clear" type="button" disabled data-en="Clear images" data-zh="清空图片">Clear images</button></div><p class="pdf-status" id="image-pdf-status" role="status" aria-live="polite"></p></section>
<p class="hint" data-en="Privacy: images are not uploaded. Each image becomes one PDF page. Large images may take longer and use more memory." data-zh="隐私说明：图片不会上传。每张图片对应 PDF 中的一页。大图片可能需要更多时间和内存。">Privacy: images are not uploaded.</p></main><footer class="footer"><div class="wrap">© <span class="year"></span> Tiny Web Toolbox · MIT</div></footer></body></html>
