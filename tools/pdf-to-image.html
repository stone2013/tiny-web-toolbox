<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>PDF to Image | Tiny Web Toolbox</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../style.css?v=20261111-1">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script defer src="pdf-to-image.js?v=20261110-2"></script>
<meta name="description" content="Convert PDF pages to PNG or JPG images locally in your browser."><link rel="canonical" href="https://stone2013.github.io/tiny-web-toolbox/tools/pdf-to-image.html"><meta property="og:title" content="PDF to Image | Tiny Web Toolbox"><meta property="og:description" content="Convert PDF pages to PNG or JPG images locally in your browser."><meta property="og:type" content="website"><meta property="og:url" content="https://stone2013.github.io/tiny-web-toolbox/tools/pdf-to-image.html"></head>
<body><header class="header"><div class="wrap header-inner"><a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">Tiny Web Toolbox</a><div class="actions"><div class="lang"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh-CN" aria-pressed="false">简中</button></div><a class="gh" href="https://github.com/stone2013/tiny-web-toolbox">GitHub</a></div></div></header>
<main class="wrap tool-main"><a class="back" href="../index.html">← <span data-en="All tools" data-zh="全部工具">All tools</span></a><h1 data-en="PDF to Image" data-zh="PDF 转图片">PDF to Image</h1><p class="tool-desc" data-en="Turn PDF pages into PNG or JPG images. Files are processed locally in your browser." data-zh="将 PDF 页面转换为 PNG 或 JPG 图片。文件仅在浏览器本地处理。">Turn PDF pages into PNG or JPG images. Files are processed locally in your browser.</p>
<section class="panel pdf-panel">
<label class="pdf-upload" for="pdf-file"><span class="pdf-upload-icon">PDF</span><strong data-en="Choose a PDF file" data-zh="选择 PDF 文件">Choose a PDF file</strong><span data-en="Tap to browse · PDF only" data-zh="点击选择 · 仅支持 PDF">Tap to browse · PDF only</span><input id="pdf-file" type="file" accept="application/pdf,.pdf"></label>
<div class="pdf-file-meta" id="pdf-file-meta" aria-live="polite"></div>
<div class="pdf-controls"><label class="pdf-option"><span data-en="Image format" data-zh="图片格式">Image format</span><select id="pdf-format"><option value="png">PNG</option><option value="jpeg">JPG</option></select></label><label class="pdf-option"><span data-en="Resolution" data-zh="清晰度">Resolution</span><select id="pdf-scale"><option value="1">Standard (1×)</option><option value="1.5" selected>High (1.5×)</option><option value="2">Very high (2×)</option></select></label><label class="pdf-option" id="pdf-quality-wrap"><span data-en="JPG quality" data-zh="JPG 质量">JPG quality</span><select id="pdf-quality"><option value="0.75">75%</option><option value="0.85" selected>85%</option><option value="0.95">95%</option></select></label></div>
<label class="pdf-range-field"><span data-en="Pages to export (optional)" data-zh="导出页码（可选）">Pages to export (optional)</span><input id="pdf-page-range" type="text" inputmode="text" autocomplete="off" placeholder="e.g. 2, 5, 8-10" data-en-placeholder="e.g. 2, 5, 8-10" data-zh-placeholder="例如：2, 5, 8-10"><small data-en="Leave blank to export every page. Use commas and ranges." data-zh="留空表示导出全部页面。可用逗号和连续页码范围。">Leave blank to export every page. Use commas and ranges.</small></label>
<div class="pdf-preview-head"><strong data-en="Page preview" data-zh="页面预览">Page preview</strong><div class="pdf-page-nav"><button class="chip" id="pdf-prev" type="button" disabled data-en="Previous" data-zh="上一页">Previous</button><span id="pdf-page-count">—</span><button class="chip" id="pdf-next" type="button" disabled data-en="Next" data-zh="下一页">Next</button></div></div>
<div class="pdf-preview" id="pdf-preview"><p class="pdf-empty" data-en="Choose a PDF to preview its pages." data-zh="选择 PDF 文件后即可预览页面。">Choose a PDF to preview its pages.</p></div>
<div class="pdf-actions"><button class="chip pdf-primary" id="pdf-download-current" type="button" disabled data-en="Download this page" data-zh="下载当前页">Download this page</button><button class="chip" id="pdf-download-all" type="button" disabled data-en="Download all pages (ZIP)" data-zh="下载全部页面（ZIP）">Download all pages (ZIP)</button></div>
<p class="pdf-status" id="pdf-status" role="status" aria-live="polite"></p></section>
<p class="hint" data-en="Privacy: your PDF is not uploaded. Conversion happens on this device. Large files or high resolutions may take longer and use more memory." data-zh="隐私说明：PDF 不会上传，转换在本设备完成。较大的文件或较高分辨率可能需要更多时间和内存。">Privacy: your PDF is not uploaded. Conversion happens on this device.</p></main><footer class="footer"><div class="wrap">© <span class="year"></span> Tiny Web Toolbox · MIT</div></footer></body></html>
