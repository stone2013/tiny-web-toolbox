<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Spreadsheet to PDF | Tiny Web Toolbox</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../style.css?v=20261111-1">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script defer src="spreadsheet-to-pdf.js?v=20261110-1"></script>
<meta name="description" content="Convert Excel and CSV spreadsheets to PDF locally in your browser."><link rel="canonical" href="https://stone2013.github.io/tiny-web-toolbox/tools/spreadsheet-to-pdf.html"></head>
<body><header class="header"><div class="wrap header-inner"><a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">Tiny Web Toolbox</a><div class="actions"><div class="lang"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh-CN" aria-pressed="false">简中</button></div><a class="gh" href="https://github.com/stone2013/tiny-web-toolbox">GitHub</a></div></div></header>
<main class="wrap tool-main"><a class="back" href="../index.html">← <span data-en="All tools" data-zh="全部工具">All tools</span></a><h1 data-en="Spreadsheet to PDF" data-zh="电子表格转 PDF">Spreadsheet to PDF</h1><p class="tool-desc" data-en="Convert an Excel or CSV sheet into a PDF. Files stay in your browser." data-zh="将 Excel 或 CSV 表格转换为 PDF。文件仅在浏览器本地处理。">Convert an Excel or CSV sheet into a PDF. Files stay in your browser.</p>
<section class="panel sheet-panel">
<label class="pdf-upload" for="sheet-file"><span class="pdf-upload-icon">XLS</span><strong data-en="Choose a spreadsheet" data-zh="选择表格文件">Choose a spreadsheet</strong><span data-en="XLSX, XLS or CSV · one file at a time" data-zh="支持 XLSX、XLS 或 CSV · 每次选择一个文件">XLSX, XLS or CSV · one file at a time</span><input id="sheet-file" type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"></label>
<div class="sheet-file-meta" id="sheet-file-meta" aria-live="polite"></div>
<div class="sheet-controls"><label class="pdf-option"><span data-en="Worksheet" data-zh="工作表">Worksheet</span><select id="sheet-name" disabled><option>—</option></select></label><label class="pdf-option"><span data-en="Page orientation" data-zh="页面方向">Page orientation</span><select id="sheet-orientation"><option value="landscape" data-en="Landscape" data-zh="横向">Landscape</option><option value="portrait" data-en="Portrait" data-zh="纵向">Portrait</option></select></label><label class="pdf-option"><span data-en="Paper size" data-zh="纸张尺寸">Paper size</span><select id="sheet-paper"><option value="a4">A4</option><option value="a3">A3</option><option value="letter">Letter</option></select></label></div>
<div class="sheet-preview-head"><strong data-en="Preview" data-zh="表格预览">Preview</strong><span id="sheet-dimensions" class="muted"></span></div>
<div class="sheet-preview-scroll"><div id="sheet-preview"><p class="pdf-empty" data-en="Choose a file to preview the worksheet." data-zh="选择文件后即可预览工作表。">Choose a file to preview the worksheet.</p></div></div>
<p class="sheet-note" id="sheet-note" aria-live="polite"></p>
<div class="pdf-actions"><button class="chip pdf-primary" id="sheet-export" type="button" disabled data-en="Export PDF" data-zh="导出 PDF">Export PDF</button><button class="chip" id="sheet-clear" type="button" disabled data-en="Clear file" data-zh="清除文件">Clear file</button></div><p class="pdf-status" id="sheet-status" role="status" aria-live="polite"></p></section>
<p class="hint" data-en="Privacy: files are not uploaded. The selected worksheet is rendered as a PDF page layout; very large sheets may take longer. Preview and export are limited to 2,000 rows and 40 columns per sheet." data-zh="隐私说明：文件不会上传。所选工作表会按 PDF 页面排版；较大的表格可能需要更多时间。每张工作表最多处理 2,000 行、40 列。">Privacy: files are not uploaded.</p></main>
<footer class="footer"><div class="wrap">© <span class="year"></span> Tiny Web Toolbox · MIT</div></footer></body></html>
