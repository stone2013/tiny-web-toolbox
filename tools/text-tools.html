<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="description" content="Clean, transform and analyze text in your browser."><title>Text Tools · Tiny Web Toolbox</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../style.css?v=20261109-2"><script defer src="text-tools.js?v=20261109-2"></script></head><body><header class="header"><div class="wrap header-inner"><a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">Tiny Web Toolbox</a><div class="actions"><div class="lang"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh-CN" aria-pressed="false">简中</button></div><a class="gh" href="https://github.com/stone2013/tiny-web-toolbox">GitHub</a></div></div></header><main class="wrap tool-main"><a class="back" href="../index.html">← <span data-en="All tools" data-zh="全部工具">All tools</span></a><h1 data-en="Text Tools" data-zh="文本工具">Text Tools</h1><p class="tool-desc" data-en="Clean up, transform and analyze text. Everything runs locally in your browser." data-zh="清理、转换和分析文本。所有处理均在浏览器本地完成。">Clean up, transform and analyze text. Everything runs locally in your browser.</p><section class="panel text-panel"><div class="text-toolbar"><strong data-en="Input" data-zh="输入文本">Input</strong><button class="clear" id="clear" data-en="Clear" data-zh="清空">Clear</button></div><label class="sr-only" for="text-input" data-en="Text input" data-zh="文本输入">Text input</label><textarea id="text-input" class="text-area" rows="9" placeholder="Type or paste your text here…" data-en-placeholder="Type or paste your text here…" data-zh-placeholder="输入或粘贴文本…"></textarea><div class="text-stats" aria-live="polite"><span><b id="chars">0</b> <span data-en="characters" data-zh="字符">characters</span></span><span><b id="no-spaces">0</b> <span data-en="without spaces" data-zh="不含空白">without spaces</span></span><span><b id="words">0</b> <span data-en="words" data-zh="词 / 字">words</span></span><span><b id="lines">0</b> <span data-en="lines" data-zh="行">lines</span></span></div><div class="text-actions"><button class="chip action" data-action="upper" data-en="UPPERCASE" data-zh="全部大写">UPPERCASE</button><button class="chip action" data-action="lower" data-en="lowercase" data-zh="全部小写">lowercase</button><button class="chip action" data-action="title" data-en="Title Case" data-zh="单词首字母大写">Title Case</button><button class="chip action" data-action="sentence" data-en="Sentence case" data-zh="句首大写">Sentence case</button><button class="chip action" data-action="trim" data-en="Trim lines" data-zh="清理每行首尾">Trim lines</button><button class="chip action" data-action="spaces" data-en="Collapse spaces" data-zh="合并多余空白">Collapse spaces</button><button class="chip action" data-action="remove-blank" data-en="Remove blank lines" data-zh="删除空行">Remove blank lines</button><button class="chip action" data-action="reverse" data-en="Reverse text" data-zh="反转文本">Reverse text</button></div><div class="text-toolbar result-toolbar"><strong data-en="Result" data-zh="处理结果">Result</strong><div class="result-actions"><button class="copy" id="use-result" data-en="Use as input" data-zh="作为输入">Use as input</button><button class="copy" id="copy-result" data-en="Copy result" data-zh="复制结果">Copy result</button></div></div><textarea id="text-result" class="text-area result-area" rows="7" readonly placeholder="Your result will appear here…" data-en-placeholder="Your result will appear here…" data-zh-placeholder="处理结果将显示在这里…"></textarea><p class="status" id="status" role="status" aria-live="polite" data-en="Ready. Choose an operation above." data-zh="准备就绪，请选择上方操作。">Ready. Choose an operation above.</p></section><p class="hint" data-en="Privacy note: your text never leaves this device." data-zh="隐私提示：你的文本不会离开本设备。">Privacy note: your text never leaves this device.</p></main><footer class="footer">
